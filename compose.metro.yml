  
###########################################################################
# Main DB Creation
###########################################################################
services:
  supabase-db:
    image: ghcr.io/supabase/postgres:15.8.1.131
    container_name: supabase-db
    restart: unless-stopped
    profiles: ["backend","supabase","litellm","unsecure","full"]
    networks: [app-network]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      PGVECTOR_ENABLED: "true"
    volumes:
      - /Users/maf001h/Documents/personal_projects/coding/volumes/supabase/supabase_db:/var/lib/postgresql/data
      - /Users/maf001h/Documents/personal_projects/coding/programs/plex/supabase/00-bootstrap.sql:/docker-entrypoint-initdb.d/00-bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 90s

###########################################################################
# DB init for sinlge postges source 
###########################################################################

  db-init-supabase:
    image: postgres:15-alpine
    restart: "no"
    profiles: ["backend","supabase","unsecure","full"]
    networks: [app-network]
    depends_on:
      supabase-db: { condition: service_healthy }
    environment:
      # Admin creds you already use to run bootstrap SQL
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}

      # NEW: app role + schema for Cipher (override in your .env if you like)
      CIPHER_DB_USER: ${CIPHER_DB_USER:-cipheruser}
      CIPHER_DB_PASSWORD: ${CIPHER_DB_PASSWORD:-cipherpass}
      CIPHER_DB_SCHEMA: ${CIPHER_DB_SCHEMA:-cipher}
    volumes:
      - ./migration/complete_setup.sql:/bootstrap/complete_setup.sql:ro
    entrypoint: ["/bin/sh","-lc"]
    command: |
      set -eu
      echo "⏳ waiting for Postgres..."
      until pg_isready -h supabase-db -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1; do sleep 1; done
      echo "✅ Postgres is ready"

      # --- Core Supabase/Archon bits (unchanged) ---
      psql -v ON_ERROR_STOP=1 -h supabase-db -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<'SQL'
      create extension if not exists vector;
      create extension if not exists "uuid-ossp";
      create extension if not exists pgcrypto;

      create schema if not exists auth;
      create table if not exists auth.schema_migrations (version text primary key);
      create table if not exists public.schema_migrations (version text primary key);

      insert into auth.schema_migrations values ('20221125140132') on conflict do nothing;
      insert into auth.schema_migrations values ('20221208132122') on conflict do nothing;
      insert into public.schema_migrations values ('20221125140132') on conflict do nothing;
      insert into public.schema_migrations values ('20221208132122') on conflict do nothing;

      alter role supabase_admin set search_path = auth, public;

      do $$
      begin
        if exists (
          select 1 from pg_class c
          join pg_namespace n on n.oid = c.relnamespace
          where n.nspname='public' and c.relname='schema_migrations' and c.relkind='r'
        ) then
          drop table public.schema_migrations cascade;
        end if;
      end $$;

      create or replace view public.schema_migrations as
        select version from auth.schema_migrations;

      create or replace rule schema_migrations_insert as
        on insert to public.schema_migrations
        do instead insert into auth.schema_migrations values (new.version);
      SQL

      # --- Realtime migration table guard (unchanged) ---
      psql -v ON_ERROR_STOP=1 -h supabase-db -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<'SQL'
      do $$
      declare
        has_table boolean;
        has_inserted_at boolean;
        version_is_bigint boolean;
        is_empty boolean;
      begin
        select exists (
          select 1 from information_schema.tables
          where table_schema='public' and table_name='schema_migrations'
        ) into has_table;

        if not has_table then return; end if;

        select exists (
          select 1 from information_schema.columns
          where table_schema='public' and table_name='schema_migrations' and column_name='inserted_at'
        ) into has_inserted_at;

        select (data_type='bigint')
        from information_schema.columns
        where table_schema='public' and table_name='schema_migrations' and column_name='version'
        into version_is_bigint;

        if has_inserted_at and version_is_bigint then return; end if;

        select count(*)=0 from public.schema_migrations into is_empty;

        if is_empty then
          execute 'drop view if exists public.schema_migrations cascade';
          execute 'create table public.schema_migrations ("version" bigint primary key, "inserted_at" timestamp(0) not null default now())';
        else
          if not has_inserted_at then
            execute 'alter table public.schema_migrations add column inserted_at timestamp(0) not null default now()';
          end if;
          if not version_is_bigint then
            execute 'alter table public.schema_migrations alter column version type bigint using version::bigint';
          end if;
        end if;
      end $$;
      SQL

      # --- NEW: Cipher app role + schema (idempotent) ---
      psql -v ON_ERROR_STOP=1 \
           -v app_user="$CIPHER_DB_USER" \
           -v app_pass="$CIPHER_DB_PASSWORD" \
           -v app_schema="$CIPHER_DB_SCHEMA" \
           -h supabase-db -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<'SQL'
      do $$
      begin
        if not exists (select 1 from pg_roles where rolname = :'app_user') then
          execute format('create role %I login password %L', :'app_user', :'app_pass');
        end if;
      end
      $$;

      create schema if not exists :"app_schema" authorization :"app_user";

      -- Ensure Cipher writes to its own schema by default
      alter role :"app_user" set search_path = :"app_schema", public, extensions;

      -- Let the app use public + extensions (for uuid, vector, etc.)
      grant usage on schema public, extensions to :"app_user";

      -- Sensible defaults for future objects in the cipher schema
      alter default privileges in schema :"app_schema" grant all on tables    to :"app_user";
      alter default privileges in schema :"app_schema" grant all on sequences to :"app_user";
      alter default privileges in schema :"app_schema" grant all on functions to :"app_user";
      SQL

      # --- Archon migration gate (unchanged) ---
      if [ "$(psql -At -h supabase-db -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "select to_regclass('public.archon_settings') is not null")" = "t" ]; then
        echo "ℹ️ 'public.archon_settings' already present — skipping complete_setup.sql"
      else
        echo "⚙️ Applying Archon migration: /bootstrap/complete_setup.sql"
        psql -v ON_ERROR_STOP=1 -h supabase-db -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f /bootstrap/complete_setup.sql
      fi

      # Ask PostgREST (if present) to refresh its schema cache
      psql -h supabase-db -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "NOTIFY pgrst, 'reload schema';"

      echo "✅ db-init-supabase guard done"

  db-init-litellm:
    image: postgres:15-alpine
    restart: "no"
    profiles: ["backend","litellm","unsecure","full"]
    networks: [app-network]
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh","-lc"]
    command: |
      set -eu
      echo "⏳ waiting for Postgres..."
      until pg_isready -h supabase-db -U "$POSTGRES_USER" -d postgres >/dev/null 2>&1; do
        sleep 1
      done
      echo "✅ Postgres ready"

      # Ensure DB exists
      if psql -h supabase-db -U "$POSTGRES_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='litellm'" | grep -q 1; then
        echo "ℹ️  DB 'litellm' already exists"
      else
        echo "🆕 creating DB 'litellm'"
        createdb -h supabase-db -U "$POSTGRES_USER" -O "$POSTGRES_USER" litellm
      fi

      until pg_isready -h supabase-db -U "$POSTGRES_USER" -d litellm >/dev/null 2>&1; do
        sleep 1
      done

      # Safe baseline extensions
      psql -v ON_ERROR_STOP=1 -h supabase-db -U "$POSTGRES_USER" -d litellm <<'SQL'
      CREATE SCHEMA IF NOT EXISTS public;
      CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
      CREATE EXTENSION IF NOT EXISTS pgcrypto;
      GRANT ALL ON SCHEMA public TO CURRENT_USER;
      ALTER SCHEMA public OWNER TO CURRENT_USER;
      SQL

      echo "✅ db-init-litellm done"

###########################################################################
# Supabase Apps
###########################################################################

  supabase-auth:
    image: supabase/gotrue:v2.178.0
    container_name: supabase-auth
    restart: unless-stopped
    profiles: ["backend","supabase","unsecure","full"]
    networks: [app-network]
    depends_on:
      supabase-db: { condition: service_healthy }
      db-init-supabase: { condition: service_completed_successfully }
    environment:
      GOTRUE_SITE_URL: ${SUPABASE_PUBLIC_URL}
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL} 
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_API_PORT: 9999
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@supabase-db:5432/${POSTGRES_DB:-postgres}
      GOTRUE_DB_DATABASE_URL: postgres://supabase_admin:${POSTGRES_PASSWORD}@supabase-db:5432/${POSTGRES_DB:-postgres}?sslmode=disable&options=-c%20search_path%3Dauth%2Cpublic
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_DISABLE_SIGNUP: "false"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    healthcheck:
      test: ["CMD","curl","-fsS","http://localhost:9999/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  supabase-rest:
    image: postgrest/postgrest:latest
    container_name: supabase-rest
    restart: unless-stopped
    profiles: ["backend","supabase","unsecure","full"]
    networks: [app-network]
    depends_on:
      supabase-db: { condition: service_healthy }
      db-init-supabase: { condition: service_completed_successfully }
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@supabase-db:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: "public,storage"
      PGRST_DB_CHANNEL_ENABLED: "true"
      PGRST_DB_CHANNEL: pgrst
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
    healthcheck:
      test: ["CMD","curl","-fsS","http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 10

  supabase-meta:
    image: supabase/postgres-meta:v0.78.0
    container_name: supabase-meta
    restart: unless-stopped
    profiles: ["backend","supabase","unsecure","full"]
    networks: [app-network]
    depends_on:
      supabase-db: { condition: service_healthy }
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB:-postgres}
      PG_META_DB_USER: ${POSTGRES_USER:-postgres}
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD","curl","-fsS","http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10


  supabase-realtime:
    image: supabase/realtime:v2.43.0
    container_name: supabase-realtime
    restart: unless-stopped
    profiles: ["backend","supabase","unsecure","full"]
    networks: [app-network]
    depends_on:
      supabase-db: { condition: service_healthy }
      db-init-supabase: { condition: service_completed_successfully }
    environment:
      DB_HOST: supabase-db
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-postgres}
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
      RLIMIT_NOFILE: "1048576"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      APP_NAME: realtime
      RELEASE_DISTRIBUTION: none
      ERL_AFLAGS: "-proto_dist inet_tcp"
      CLUSTER_STRATEGIES: "POSTGRES"

    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    healthcheck:
      test: ["CMD-SHELL","/bin/sh -c '</dev/tcp/localhost/4000'"]
      interval: 10s
      timeout: 5s
      retries: 10

  supabase-storage:
    image: supabase/storage-api:v1.26.3
    container_name: supabase-storage
    restart: unless-stopped
    profiles: ["backend","supabase","unsecure","full"]
    networks: [app-network]
    depends_on:
      supabase-db: { condition: service_healthy }
      db-init-supabase: { condition: service_completed_successfully }
      supabase-auth:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://supabase-rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@supabase-db:5432/${POSTGRES_DB:-postgres}
      FILE_SIZE_LIMIT: 52428800
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
    volumes:
      - /Users/maf001h/Documents/personal_projects/coding/volumes/supabase/supabase_storage:/var/lib/storage
    healthcheck:
      test: ["CMD","curl","-fsS","http://localhost:5000/status"]
      interval: 10s
      timeout: 5s
      retries: 10

  supabase-kong:
    image: ghcr.io/supabase/kong:2.8.1
    container_name: supabase-kong
    restart: unless-stopped
    profiles: ["backend","supabase","unsecure","full"]
    networks: [app-network]
    depends_on:
      supabase-auth:
        condition: service_started
      supabase-rest:
        condition: service_started
      supabase-realtime:
        condition: service_started
      supabase-storage:
        condition: service_started
    environment:
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_DATABASE: off
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,SRV,A,CNAME
      KONG_PLUGINS: request-transformer,cors
      KONG_LOG_LEVEL: notice
      JWT_SECRET: ${JWT_SECRET}
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_AUTH_URL: http://supabase-auth:9999
      SUPABASE_REST_URL: http://supabase-rest:3000
      SUPABASE_REALTIME_URL: http://supabase-realtime:4000/socket
      SUPABASE_STORAGE_URL: http://supabase-storage:5000
    ports:
      - "8000:8000"
    volumes:
      - /Users/maf001h/Documents/personal_projects/coding/programs/plex/supabase/kong.yml:/home/kong/kong.yml:ro

  supabase-studio:
    image: supabase/studio:2025.08.18-sha-c153df2
    container_name: supabase-studio
    restart: unless-stopped
    profiles: ["supabase","unsecure","full"]
    networks: [app-network]
    depends_on:
      supabase-kong:
        condition: service_started
    environment:
      # Server-side (inside Docker)
      SUPABASE_URL: http://supabase-kong:8000
      STUDIO_PG_META_URL: http://supabase-meta:8080
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      # Client-side (browser) should call public host through Traefik
      NEXT_PUBLIC_SUPABASE_URL: https://supabase.127.0.0.1.nip.io
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
    healthcheck:
      test: ["CMD", "true"]
      interval: 10s
      timeout: 3s
      retries: 1
      start_period: 5s

###########################################################################
# Archon Server 
###########################################################################
  archon-server:
    profiles: ["backend","archon","unsecure","full"]
    depends_on:
      db-init-supabase: { condition: service_completed_successfully }
      supabase-kong:    { condition: service_healthy }   # Kong should have a healthcheck
    env_file: []
  
  cipher-ui:
    profiles: ["backend","cipher","unsecure","full"]

###########################################################################
# Librechat 
###########################################################################
  vectordb:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      
###########################################################################
# LiteLLM (DB bootstrap → migrations → proxy/UI)
###########################################################################
#Runs Prisma migrations (one-shot, exits when done)
  litellm-migrate:
    image: ghcr.io/berriai/litellm-database:main-stable
    restart: "no"
    profiles: ["backend","litellm","unsecure","full"]
    networks: [app-network]
    depends_on:
      supabase-db:
        condition: service_healthy
      db-init-litellm:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@supabase-db:5432/litellm"

  # LiteLLM proxy/UI (long-running, behind Traefik)
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    profiles: ["backend","litellm","unsecure","full"]
    networks: [app-network]
    depends_on:
      supabase-db:
        condition: service_healthy
      db-init-litellm:
        condition: service_completed_successfully
      litellm-migrate:
        condition: service_started
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      UI_USERNAME: ${LITELLM_UI_USERNAME:-admin}
      UI_PASSWORD: ${LITELLM_UI_PASSWORD:-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      STORAGE_BACKEND: file
    volumes:
      - /Users/maf001h/Documents/personal_projects/coding/programs/plex/litellm/litellm.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--detailed_debug", "--host", "0.0.0.0", "--port", "4000"]

networks:
  app-network:
    driver: bridge