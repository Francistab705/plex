# /supabase/kong.yml
_format_version: "2.1"
_transform: true

services:
  - name: auth
    url: http://supabase-auth:9999
    routes:
      - name: auth_v1
        paths: ["/auth/v1"]
        strip_path: true
        methods: ["GET","POST","OPTIONS"]

  - name: rest
    url: http://supabase-rest:3000
    routes:
      # Normal REST route (unchanged)
      - name: rest_v1
        paths: ["/rest/v1"]
        strip_path: true
        methods: ["GET","POST","PATCH","PUT","DELETE","OPTIONS"]

      # NEW: dedicate HEAD to a separate route so we can transform headers
      - name: rest_v1_head
        paths: ["/rest/v1"]
        strip_path: true
        methods: ["HEAD"]
        plugins:
          - name: request-transformer
            config:
              # PostgREST chokes on object mode when multiple rows exist.
              remove:
                headers:
                  - "Accept"
              add:
                headers:
                  - "Accept: application/json"
                  # helps clients know counts without fetching bodies
                  - "Prefer: count=exact"

  - name: storage
    url: http://supabase-storage:5000
    routes:
      - name: storage_v1
        paths: ["/storage/v1"]
        strip_path: true
        methods: ["GET","POST","PUT","DELETE","OPTIONS"]

  - name: realtime
    url: http://supabase-realtime:4000/socket
    routes:
      - name: realtime_v1
        paths: ["/realtime/v1"]
        strip_path: true
        protocols: ["http","https"]

# Global CORS (dev)
plugins:
  - name: cors
    config:
      origins: ["*"]
      methods: ["GET","POST","PUT","PATCH","DELETE","OPTIONS"]
      headers: ["Authorization","apikey","Content-Type","X-Client-Info","Range","Prefer"]
      exposed_headers: ["Content-Range","Content-Type","Date","Content-Profile","Content-Encoding"]
      credentials: true
      max_age: 3600
      preflight_continue: false
