services:
  # Ensure the Graphiti API service is included in your chosen profile
  graph:
    container_name: graphiti-graph
    profiles: ["backend","full"]
    ports:
      - "8001:8000"   # host 8001 -> container 8000

  neo4j:
    image: neo4j:5-community
    container_name: graphiti-neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-graphitiNeo4jPass}
      - NEO4J_server_bolt_listen__address=:7687
      - NEO4J_server_http_listen__address=:7474
      - NEO4J_server_default__advertised__address=neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - /Users/maf001h/Documents/personal_projects/coding/volumes/graphiti/neo4j/data:/data
      - /Users/maf001h/Documents/personal_projects/coding/volumes/graphiti/neo4j/logs:/logs
      - /Users/maf001h/Documents/personal_projects/coding/volumes/graphiti/neo4j/plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p \"${NEO4J_PASSWORD:-graphitiNeo4jPass}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    profiles: ["backend","full"]

  graphiti-mcp:
    image: zepai/knowledge-graph-mcp:latest
    container_name: graphiti-mcp
    restart: unless-stopped
    env_file:
      - /Users/maf001h/Documents/personal_projects/coding/agents/yung_metro/.env.plex
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-graphitiNeo4jPass}
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "8002:8000"  # MCP on 8000
    profiles: ["frontend","full"]
