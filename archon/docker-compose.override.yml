services:
  archon-server:
    healthcheck:
      test:
        - CMD-SHELL
        - >
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:${ARCHON_SERVER_PORT:-8181}/health', timeout=2).read();
          print('ok')"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  archon-mcp:
    depends_on:
      archon-server:
        condition: service_healthy

  archon-frontend:
    depends_on:
      archon-server:
        condition: service_healthy
